name: domi

services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: domi_development
      POSTGRES_USER: domi
      POSTGRES_PASSWORD: domi_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domi -d domi_development"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    build:
      context: services/api
      dockerfile: Dockerfile.dev
    working_dir: /workspace/services/api
    command: bin/rails server --binding 0.0.0.0 --port 3000
    environment:
      DATABASE_URL: postgresql://domi:domi_local_only@postgres:5432/domi_development
      RAILS_ENV: development
      APP_VERSION: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/workspace
      - bundle_data:/usr/local/bundle

volumes:
  postgres_data:
  bundle_data:
