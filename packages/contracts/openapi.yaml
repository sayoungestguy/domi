openapi: 3.1.0
info:
  title: Domi API
  version: 1.3.0
  description: Versioned contract shared by Domi clients and the Rails API.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: System
  - name: Authentication
  - name: Account
  - name: Households
  - name: Inventory
  - name: Shopping
paths:
  /api/v1/health:
    get:
      operationId: getApiHealth
      summary: Verify API connectivity and contract version
      tags: [System]
      responses:
        "200":
          description: API is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account]
              properties:
                account:
                  $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Account created; email verification is required.
          content:
            application/json:
              schema:
                type: object
                required: [user, verificationRequired]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  verificationRequired: { type: boolean, const: true }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/auth/session:
    post:
      operationId: createSession
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session]
              properties:
                session:
                  type: object
                  required: [email, password]
                  properties:
                    email: { type: string, format: email }
                    password: { type: string, format: password }
      responses:
        "201": { $ref: "#/components/responses/Authenticated" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: destroySession
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session family revoked. }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/session/refresh:
    post:
      operationId: refreshSession
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "201":
          description: Rotated session credentials.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/email-verification:
    post:
      operationId: verifyEmail
      tags: [Authentication]
      requestBody:
        $ref: "#/components/requestBodies/Token"
      responses:
        "200": { $ref: "#/components/responses/Authenticated" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/auth/email-verification/resend:
    post:
      operationId: resendEmailVerification
      tags: [Authentication]
      requestBody:
        $ref: "#/components/requestBodies/Email"
      responses:
        "202": { description: Request accepted regardless of account existence. }
  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [Authentication]
      requestBody:
        $ref: "#/components/requestBodies/Email"
      responses:
        "202": { description: Request accepted regardless of account existence. }
    patch:
      operationId: resetPassword
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, passwordConfirmation]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 12, maxLength: 72 }
                passwordConfirmation: { type: string, format: password }
      responses:
        "200": { $ref: "#/components/responses/Authenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [Account]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCurrentUser
      tags: [Account]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user:
                  type: object
                  required: [displayName]
                  properties:
                    displayName: { type: string, maxLength: 80 }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/households:
    get:
      operationId: listHouseholds
      tags: [Households]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user's households.
          content:
            application/json:
              schema:
                type: object
                required: [households]
                properties:
                  households:
                    type: array
                    items: { $ref: "#/components/schemas/Household" }
    post:
      operationId: createHousehold
      tags: [Households]
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/Household"
      responses:
        "201": { $ref: "#/components/responses/Household" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/households/{householdId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: getHousehold
      tags: [Households]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Household" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateHousehold
      tags: [Households]
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/HouseholdUpdate"
      responses:
        "200": { $ref: "#/components/responses/Household" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/households/{householdId}/memberships:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: listMemberships
      tags: [Households]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Household members.
          content:
            application/json:
              schema:
                type: object
                required: [memberships]
                properties:
                  memberships:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }
  /api/v1/households/{householdId}/memberships/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/MembershipId"
    delete:
      operationId: removeMembership
      tags: [Households]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Member removed. }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/households/{householdId}/membership:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    delete:
      operationId: leaveHousehold
      tags: [Households]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Current member left. }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/households/{householdId}/ownership:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      operationId: transferOwnership
      tags: [Households]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membershipId]
              properties:
                membershipId: { type: string, format: uuid }
      responses:
        "200":
          description: Ownership transferred.
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/households/{householdId}/invitations:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: listInvitations
      tags: [Households]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Household invitations without secret tokens.
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
    post:
      operationId: createInvitation
      tags: [Households]
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Invitation created; token is returned only once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationSecret"
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/households/{householdId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/InvitationId"
    delete:
      operationId: revokeInvitation
      tags: [Households]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Invitation revoked. }
  /api/v1/households/{householdId}/categories:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: listCategories
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active household inventory categories.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
    post:
      operationId: createCategory
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/Category"
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                type: object
                required: [category]
                properties:
                  category: { $ref: "#/components/schemas/Category" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/households/{householdId}/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/CategoryId"
    patch:
      operationId: updateCategory
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/Category"
      responses:
        "200": { description: Category updated. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/households/{householdId}/inventory/summary:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: getInventorySummary
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Inventory attention counts and recent activity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryDashboard" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/households/{householdId}/inventory-items:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: listInventoryItems
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/InventoryStatus" }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Filtered household inventory.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryItem" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createInventoryItem
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/InventoryItem"
      responses:
        "201": { $ref: "#/components/responses/InventoryItemResult" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/households/{householdId}/inventory-items/{inventoryItemId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/InventoryItemId"
    get:
      operationId: getInventoryItem
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Inventory item.
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: "#/components/schemas/InventoryItem" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateInventoryItem
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        $ref: "#/components/requestBodies/InventoryItem"
      responses:
        "200": { $ref: "#/components/responses/InventoryItemResult" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/households/{householdId}/inventory-items/{inventoryItemId}/status:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/InventoryItemId"
      - $ref: "#/components/parameters/IfMatch"
    patch:
      operationId: changeInventoryStatus
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/InventoryStatus" }
      responses:
        "200":
          description: Updated inventory item and shopping-list action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryStatusResult" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/households/{householdId}/inventory-items/{inventoryItemId}/archive:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/InventoryItemId"
      - $ref: "#/components/parameters/IfMatch"
    post:
      operationId: archiveInventoryItem
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/InventoryItem" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/households/{householdId}/inventory-items/{inventoryItemId}/restore:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/InventoryItemId"
      - $ref: "#/components/parameters/IfMatch"
    post:
      operationId: restoreInventoryItem
      tags: [Inventory]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/InventoryItem" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/households/{householdId}/shopping-list:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: getShoppingList
      tags: [Shopping]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The household's single active shopping list.
          content:
            application/json:
              schema:
                type: object
                required: [shoppingList]
                properties:
                  shoppingList: { $ref: "#/components/schemas/ShoppingList" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/households/{householdId}/shopping-list/entries:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      operationId: createShoppingEntry
      tags: [Shopping]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/ShoppingEntry"
      responses:
        "200": { $ref: "#/components/responses/ShoppingEntry" }
        "201": { $ref: "#/components/responses/ShoppingEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/households/{householdId}/shopping-list/entries/{shoppingEntryId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ShoppingEntryId"
      - $ref: "#/components/parameters/IfMatch"
    patch:
      operationId: updateShoppingEntry
      tags: [Shopping]
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/ShoppingEntryUpdate"
      responses:
        "200": { $ref: "#/components/responses/ShoppingEntry" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: removeShoppingEntry
      tags: [Shopping]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Entry removed from the active list. }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/households/{householdId}/shopping-list/entries/{shoppingEntryId}/purchased:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ShoppingEntryId"
      - $ref: "#/components/parameters/IfMatch"
    patch:
      operationId: setShoppingEntryPurchased
      tags: [Shopping]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchased]
              properties:
                purchased: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/ShoppingEntry" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /api/v1/households/{householdId}/shopping-preference:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    patch:
      operationId: updateShoppingPreference
      tags: [Shopping]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autoAddOutItems]
              properties:
                autoAddOutItems: { type: boolean }
      responses:
        "200":
          description: Updated automatic-add preference.
          content:
            application/json:
              schema:
                type: object
                required: [autoAddOutItems]
                properties:
                  autoAddOutItems: { type: boolean }
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [Households]
      security: [{ bearerAuth: [] }]
      requestBody:
        $ref: "#/components/requestBodies/Token"
      responses:
        "201": { $ref: "#/components/responses/Household" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InventoryItemId:
      name: inventoryItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShoppingEntryId:
      name: shoppingEntryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key reused when retrying the same entry creation.
      schema: { type: string, minLength: 8, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current integer resource version, optionally quoted.
      schema: { type: string, pattern: '^(W/)?"?[0-9]+"?$' }
  requestBodies:
    Email:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
    Token:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }
    Household:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [household]
            properties:
              household:
                type: object
                required: [name]
                properties:
                  name: { type: string, maxLength: 100 }
                  timezone: { type: string, example: Asia/Singapore }
    HouseholdUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [household]
            properties:
              household:
                type: object
                minProperties: 1
                properties:
                  name: { type: string, maxLength: 100 }
                  timezone: { type: string, example: Asia/Singapore }
    Category:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [category]
            properties:
              category:
                type: object
                required: [name]
                properties:
                  name: { type: string, minLength: 1, maxLength: 80 }
                  position: { type: integer, minimum: 0 }
    InventoryItem:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [inventoryItem]
            properties:
              inventoryItem: { $ref: "#/components/schemas/InventoryItemInput" }
    ShoppingEntry:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [shoppingEntry]
            properties:
              shoppingEntry: { $ref: "#/components/schemas/ShoppingEntryInput" }
    ShoppingEntryUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [shoppingEntry]
            properties:
              shoppingEntry: { $ref: "#/components/schemas/ShoppingEntryUpdateInput" }
  responses:
    Authenticated:
      description: Authenticated user and new mobile credentials.
      content:
        application/json:
          schema:
            type: object
            required: [user, session]
            properties:
              user: { $ref: "#/components/schemas/User" }
              session: { $ref: "#/components/schemas/Session" }
    User:
      description: Current user.
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: { $ref: "#/components/schemas/User" }
    Household:
      description: Household visible to the current user.
      content:
        application/json:
          schema:
            type: object
            required: [household]
            properties:
              household: { $ref: "#/components/schemas/Household" }
    Error:
      description: Request failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationError:
      description: Input validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ConflictError:
      description: Resource version or domain invariant conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InventoryItem:
      description: Inventory item.
      content:
        application/json:
          schema:
            type: object
            required: [item]
            properties:
              item: { $ref: "#/components/schemas/InventoryItem" }
    InventoryItemResult:
      description: Inventory item and non-blocking domain warnings.
      content:
        application/json:
          schema:
            type: object
            required: [item, warnings]
            properties:
              item: { $ref: "#/components/schemas/InventoryItem" }
              warnings:
                type: array
                items: { $ref: "#/components/schemas/Warning" }
    ShoppingEntry:
      description: Shopping entry.
      content:
        application/json:
          schema:
            type: object
            required: [entry]
            properties:
              entry: { $ref: "#/components/schemas/ShoppingEntry" }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: domi-api }
        version: { type: string }
    RegistrationInput:
      type: object
      required: [email, displayName, password, passwordConfirmation]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, maxLength: 80 }
        password: { type: string, format: password, minLength: 12, maxLength: 72 }
        passwordConfirmation: { type: string, format: password }
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, emailVerified, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, accessExpiresAt, refreshExpiresAt]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessExpiresAt: { type: string, format: date-time }
        refreshExpiresAt: { type: string, format: date-time }
    Household:
      type: object
      additionalProperties: false
      required: [id, name, timezone, role, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        role: { type: string, enum: [owner, member] }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
    Membership:
      type: object
      additionalProperties: false
      required: [id, role, joinedAt, user]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [owner, member] }
        joinedAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
    Invitation:
      type: object
      required: [id, expiresAt, createdAt, createdBy]
      properties:
        id: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        acceptedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/User" }
    InvitationSecret:
      type: object
      required: [invitation, token, inviteUrl]
      properties:
        invitation: { $ref: "#/components/schemas/Invitation" }
        token: { type: string }
        inviteUrl: { type: string }
    InventoryStatus:
      type: string
      enum: [ok, low, out]
    Category:
      type: object
      additionalProperties: false
      required: [id, name, position, archivedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
        archivedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InventoryItemInput:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        status: { $ref: "#/components/schemas/InventoryStatus" }
        quantity: { type: [number, "null"], minimum: 0 }
        unit: { type: [string, "null"], maxLength: 40 }
        notes: { type: [string, "null"], maxLength: 2000 }
        categoryId: { type: [string, "null"], format: uuid }
    InventoryItem:
      type: object
      additionalProperties: false
      required:
        [id, householdId, name, status, quantity, unit, notes, category, version,
         archivedAt, updatedBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: "#/components/schemas/InventoryStatus" }
        quantity: { type: [number, "null"] }
        unit: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        category:
          oneOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
        version: { type: integer, minimum: 0 }
        archivedAt: { type: [string, "null"], format: date-time }
        updatedBy: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InventorySummary:
      type: object
      additionalProperties: false
      required: [total, ok, low, out, needsAttention, updatedAt]
      properties:
        total: { type: integer, minimum: 0 }
        ok: { type: integer, minimum: 0 }
        low: { type: integer, minimum: 0 }
        out: { type: integer, minimum: 0 }
        needsAttention: { type: integer, minimum: 0 }
        updatedAt: { type: [string, "null"], format: date-time }
    Activity:
      type: object
      additionalProperties: false
      required: [id, action, message, actor, subjectType, subjectId, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        message: { type: string }
        actor: { $ref: "#/components/schemas/User" }
        subjectType: { type: string }
        subjectId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    InventoryDashboard:
      type: object
      additionalProperties: false
      required: [summary, recentActivity]
      properties:
        summary: { $ref: "#/components/schemas/InventorySummary" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
    ShoppingEntryInput:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        quantity: { type: [number, "null"], minimum: 0 }
        note: { type: [string, "null"], maxLength: 1000 }
        inventoryItemId: { type: string, format: uuid }
    ShoppingEntryUpdateInput:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        quantity: { type: [number, "null"], minimum: 0 }
        note: { type: [string, "null"], maxLength: 1000 }
    ShoppingEntry:
      type: object
      additionalProperties: false
      required:
        [id, householdId, name, quantity, note, purchased, checkedAt,
         inventoryItemId, version, addedBy, updatedBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: [number, "null"] }
        note: { type: [string, "null"] }
        purchased: { type: boolean }
        checkedAt: { type: [string, "null"], format: date-time }
        inventoryItemId: { type: [string, "null"], format: uuid }
        version: { type: integer, minimum: 0 }
        addedBy: { $ref: "#/components/schemas/User" }
        updatedBy: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ShoppingList:
      type: object
      additionalProperties: false
      required:
        [id, householdId, entries, remainingCount, purchasedCount,
         autoAddOutItems, updatedAt]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        entries:
          type: array
          items: { $ref: "#/components/schemas/ShoppingEntry" }
        remainingCount: { type: integer, minimum: 0 }
        purchasedCount: { type: integer, minimum: 0 }
        autoAddOutItems: { type: boolean }
        updatedAt: { type: [string, "null"], format: date-time }
    InventoryShoppingOutcome:
      type: object
      additionalProperties: false
      required: [automaticallyAdded, shouldPrompt, entry]
      properties:
        automaticallyAdded: { type: boolean }
        shouldPrompt: { type: boolean }
        entry:
          oneOf:
            - $ref: "#/components/schemas/ShoppingEntry"
            - type: "null"
    InventoryStatusResult:
      type: object
      additionalProperties: false
      required: [item, shopping]
      properties:
        item: { $ref: "#/components/schemas/InventoryItem" }
        shopping: { $ref: "#/components/schemas/InventoryShoppingOutcome" }
    Warning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, details]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object, additionalProperties: true }
